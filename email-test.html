<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Email Test — Lush &amp; Luxe</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{--bg:#faf6f6;--card:#fff;--ink:#1a1010;--muted:#8a7272;--rose:#b06a75;--line:rgba(201,134,143,.25);--good:#2f7a4f;--good-bg:#e6f3ea;--bad:#a63d3d;--bad-bg:#f8e3e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d0e;--card:#1e1517;--ink:#f6eced;--muted:#a89092;--rose:#e3a9b2;--line:rgba(238,188,195,.16);--good:#7fcf9c;--good-bg:#16291e;--bad:#f09a9a;--bad-bg:#331a1a}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;padding:24px 16px;line-height:1.5}
.card{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
h1{font-size:1.25rem;margin-bottom:6px} p{color:var(--muted);font-size:.92rem;margin-bottom:16px}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem;margin-bottom:14px}
button{width:100%;padding:13px;border:0;border-radius:999px;background:var(--rose);color:#fff;font-size:1rem;font-weight:600;margin-bottom:10px;cursor:pointer}
.res{margin-top:10px;padding:12px 14px;border-radius:10px;font-size:.92rem;white-space:pre-wrap;word-break:break-word}
.ok{background:var(--good-bg);color:var(--good)} .err{background:var(--bad-bg);color:var(--bad)}
</style>
</head>
<body>
<div class="card">
  <h1>Booking email test</h1>
  <p>This sends the same two emails a real booking sends, and shows exactly what the email service replies.</p>
  <label>Send the "client" test email to:</label>
  <input id="to" type="email" value="lushnluxestudio@gmail.com"/>
  <button id="b1">1 · Send owner email</button>
  <button id="b2">2 · Send client email</button>
  <div id="out"></div>
</div>
<script>
const CFG = { pub:'2-u9gqaRQwwwYchE9', svc:'service_2y5xhmy', owner:'template_c592nyl', client:'template_7ofjrno' };
const out = document.getElementById('out');
function show(label, ok, text){ const d=document.createElement('div'); d.className='res '+(ok?'ok':'err'); d.textContent=(ok?'✓ ':'✗ ')+label+': '+text; out.prepend(d); }
if (typeof emailjs === 'undefined') show('Setup', false, 'The email service script did not load (check internet / ad-blocker).');
else emailjs.init({ publicKey: CFG.pub });
async function send(label, tpl, params){
  if (typeof emailjs === 'undefined') return;
  try { const r = await emailjs.send(CFG.svc, tpl, params); show(label, true, 'Sent (status '+r.status+'). Check the inbox and spam folder.'); }
  catch(e){ show(label, false, 'Status '+(e && e.status)+' — '+((e && (e.text||e.message)) || JSON.stringify(e))); }
}
const common = { service:'TEST — Classic Cat Eye / Wispy', date:'Test date', time:'10:30 AM', booking_ref:'LNL-TEST', notes:'This is a test' };
document.getElementById('b1').onclick = ()=> send('Owner email', CFG.owner, Object.assign({
  to_email:'lushnluxestudio@gmail.com', to_name:'Studio Owner', client_name:'Test Client', client_phone:'+233 00 000 0000',
  client_email: document.getElementById('to').value, payment_ref:'TEST' }, common));
document.getElementById('b2').onclick = ()=> send('Client email', CFG.client, Object.assign({
  to_email: document.getElementById('to').value, to_name:'Test Client', studio_name:'Lush & Luxe Studio', studio_phone:'+233 555 326 284' }, common));
</script>
</body>
</html>
